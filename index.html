<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titre de la page</title>
    <!-- Lien vers un fichier CSS externe (optionnel) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bienvenue sur ma page web</h1>
        <nav>
            <ul>
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#apropos">À propos</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="accueil">
            <h2>Section d'accueil</h2>
            <p>Ceci est le contenu principal de la page.</p>
        </section>

        <section id="apropos">
            <h2>À propos</h2>
            <p>Quelques informations ici.</p>
        </section>
<section id="competences">
    <h2>Compétences</h2>
    <div class="skill">
        <div class="skill-name">HTML5</div>
        <div class="skill-bar">
            <div class="skill-level" style="width: 90%;">90%</div>
        </div>
    </div>

    <div class="skill">
        <div class="skill-name">CSS3</div>
        <div class="skill-bar">
            <div class="skill-level" style="width: 85%;">85%</div>
        </div>
    </div>

    <div class="skill">
        <div class="skill-name">JavaScript</div>
        <div class="skill-bar">
            <div class="skill-level" style="width: 70%;">70%</div>
        </div>
    </div>

    <div class="skill">
        <div class="skill-name">Git & GitHub</div>
        <div class="skill-bar">
            <div class="skill-level" style="width: 80%;">80%</div>
        </div>
    </div>

    <div class="skill">
        <div class="skill-name">Responsive Design</div>
        <div class="skill-bar">
            <div class="skill-level" style="width: 75%;">75%</div>
        </div>
    </div>
</section>
        <section id="contact">
            <h2>Contact</h2>
            <form>
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom">
                
                <label for="email">Email :</label>
                <input type="email" id="email" name="email">
                
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Tous droits réservés</p>
    </footer>

    <!-- Script JavaScript (optionnel) -->
    <script src="script.js"></script>
</body>
</html>
